; The USB Serial/JTAG port of the ESP32-S3 (the USB connector of GPIO19 / GPIO20): /dev/ttyACM* on the host.
; The device is announced to dmtty, which attaches a TTY to it.
[main]
driver_order=-3

[usb_serial]
; the bytes from the host wait in this ring until a reader takes them
rx_ring_size=256
rx_ring_wait_mode=some_data
; how long a write waits for the host to read before the bytes are dropped (no host connected)
tx_timeout_ms=20
